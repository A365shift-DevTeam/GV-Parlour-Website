    <!-- Chatbot script waits for the first user interaction. No idle timer: the
         widget pulls ~800 KiB of third-party JS and fonts, and loading it
         unprompted costs every visitor that (and the page's load metrics) whether
         or not they ever chat. openChatbot() also calls window.__loadChatbot. -->
    <script>
      (function() {
        var loaded = false;
        function loadBot() {
          if (loaded) return;
          loaded = true;
          window.removeEventListener('scroll', loadBot);
          window.removeEventListener('pointerdown', loadBot);
          window.removeEventListener('touchstart', loadBot);
          window.removeEventListener('keydown', loadBot);
          var s = document.createElement('script');
          s.id = 'messenger-widget-b';
          s.src = 'https://cdn.express-chat.com/website-bot.js';
          s.textContent = '6aa8f78cd90da7873b95be6a,6aa8f687d0a66213bd667440';
          document.body.appendChild(s);
        }
        window.__loadChatbot = loadBot;
        window.addEventListener('scroll', loadBot, { passive: true, once: true });
        window.addEventListener('pointerdown', loadBot, { passive: true, once: true });
        window.addEventListener('touchstart', loadBot, { passive: true, once: true });
        window.addEventListener('keydown', loadBot, { passive: true, once: true });
      })();
    </script>
